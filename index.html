<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
    <meta name="description" content="An application built with Google AI Studio." />
    <meta property="og:title" content="My Google AI Studio App" />
    <meta property="og:description" content="An application built with Google AI Studio." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ruffs Hub" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Last-resort safety net: catches ANY error anywhere — including ones our
      // own React app can never see (a script failing to load, an error before
      // React mounts, an unhandled promise rejection). This runs as plain
      // JavaScript before anything else, so it works even if the whole app
      // bundle fails. If the #root element is still empty a moment after an
      // error, something failed to render — show a real recovery screen
      // instead of leaving the page blank.
      (function () {
        var shown = false;
        function showFallback(detail) {
          if (shown) return;
          var root = document.getElementById('root');
          if (!root || root.children.length > 0) return; // app is actually rendering fine, leave it alone
          shown = true;
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:sans-serif;background:#0f172a;color:white;">' +
            '<div style="font-size:48px;margin-bottom:16px;">🏠</div>' +
            '<h1 style="font-size:20px;font-weight:800;margin-bottom:8px;">Something went wrong</h1>' +
            '<p style="font-size:14px;color:#94a3b8;margin-bottom:20px;max-width:400px;">The app hit an unexpected error and couldn\'t load. Your data is safe on this device and in the cloud. Reloading usually fixes this.</p>' +
            '<button onclick="window.location.reload()" style="padding:10px 24px;background:#f59e0b;color:#0f172a;font-weight:800;border-radius:12px;border:none;cursor:pointer;font-size:14px;">Reload App</button>' +
            '<p style="font-size:11px;color:#475569;margin-top:24px;max-width:400px;word-break:break-word;">' + (detail || '') + '</p>' +
            '</div>';
        }
        window.addEventListener('error', function (e) {
          setTimeout(function () { showFallback(e.message); }, 100);
        });
        window.addEventListener('unhandledrejection', function (e) {
          setTimeout(function () { showFallback(e.reason && e.reason.message ? e.reason.message : String(e.reason)); }, 100);
        });
        // Also catch the case where the app just never renders anything at
        // all within a few seconds, even without a caught error event.
        setTimeout(function () { showFallback('App did not load in time.'); }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
